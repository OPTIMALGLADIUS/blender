name: Build Blender Android APKs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "CMake / Blender build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
  push:
    branches:
      - android
      - "android/**"

concurrency:
  group: blender-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: "27.2.12479018"
  ANDROID_COMPILE_SDK: "34"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: "6G"

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          packages: |
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_COMPILE_SDK }}.0.0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            ccache \
            git \
            python3 \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libegl1-mesa-dev

      - name: Cache ccache and precompiled Android libs
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
            lib/
          key: blender-android-${{ runner.os }}-${{ hashFiles('.github/workflows/build-android-apks.yml', 'CMakeLists.txt', 'GNUmakefile') }}
          restore-keys: |
            blender-android-${{ runner.os }}-

      - name: Fetch precompiled libraries if missing
        run: |
          if [ ! -d "lib/android_arm64" ] && [ -f "GNUmakefile" ]; then
            make update || true
          fi

      - name: Build blender_full.apk
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
        run: |
          # Adjust these flags/targets to match your fork's Android CMake/Gradle setup
          cmake -B build_full -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DWITH_ANDROID=ON \
            -DBUILD_ANDROID_VARIANT=FULL
          cmake --build build_full --target gradle_assemble -j"$(nproc)"

          mkdir -p artifacts
          FULL_APK_PATH="$(find build_full -name '*.apk' -type f | head -n 1)"
          test -n "$FULL_APK_PATH"
          cp "$FULL_APK_PATH" artifacts/blender_full.apk

          # Free disk space before building Lite
          rm -rf build_full

      - name: Build blender_lite.apk
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
        run: |
          # Adjust Lite feature-disabling flags to match your fork's Lite configuration
          cmake -B build_lite -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DWITH_ANDROID=ON \
            -DBUILD_ANDROID_VARIANT=LITE \
            -DWITH_CYCLES=OFF \
            -DWITH_CODEC_FFMPEG=OFF
          cmake --build build_lite --target gradle_assemble -j"$(nproc)"

          LITE_APK_PATH="$(find build_lite -name '*.apk' -type f | head -n 1)"
          test -n "$LITE_APK_PATH"
          cp "$LITE_APK_PATH" artifacts/blender_lite.apk

          rm -rf build_lite

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apks-${{ github.sha }}
          path: |
            artifacts/blender_full.apk
            artifacts/blender_lite.apk
          if-no-files-found: error
