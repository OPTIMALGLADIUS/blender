name: Build Blender Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - android
      - "android/**"

concurrency:
  group: blender-android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_HOME: /home/runner/android-sdk
  ANDROID_SDK_ROOT: /home/runner/android-sdk
  ANDROID_NDK_VERSION: "30.0.16248370"
  CCACHE_DIR: /home/runner/work/blender/blender/.ccache
  CCACHE_MAXSIZE: "6G"

jobs:
  build-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies and GCC 14
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            software-properties-common \
            curl \
            ca-certificates \
            git \
            git-lfs \
            build-essential \
            cmake \
            ninja-build \
            patchelf \
            zip \
            unzip \
            python3 \
            ccache \
            libx11-dev \
            libxxf86vm-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxkbcommon-dev \
            libdbus-1-dev \
            libegl1-mesa-dev
          if ! g++ --version | grep -qE "g\+\+ \(.*\) (14|15|16)\."; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends gcc-14 g++-14
          fi

      - name: Set up Android SDK and NDK r30
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: ""

      - name: Install required SDK platforms, build-tools, and NDK
        run: |
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

          NDK_DIR="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          if ! sdkmanager "ndk;${ANDROID_NDK_VERSION}"; then
            curl -fL -o /tmp/android-ndk-r30-linux.zip \
              "https://dl.google.com/android/repository/android-ndk-r30-linux.zip"
            unzip -q /tmp/android-ndk-r30-linux.zip -d /tmp
            mkdir -p "${ANDROID_HOME}/ndk"
            rm -rf "${NDK_DIR}"
            mv /tmp/android-ndk-r30 "${NDK_DIR}"
            rm -f /tmp/android-ndk-r30-linux.zip
          fi

          # Keep compatibility if env.sh looks for the earlier beta folder name
          ln -sfn "${NDK_DIR}" "${ANDROID_HOME}/ndk/30.0.14904198-beta1"

      - name: Pull Git LFS assets and initialize submodules
        run: |
          git config lfs.url https://projects.blender.org/blender/blender.git/info/lfs
          git config --local credential.https://projects.blender.org.helper \
            '!f() { echo username=; echo password=; }; f'
          git lfs install --local
          git lfs pull

          HOST_LIB=lib/linux_x64
          git -c "submodule.${HOST_LIB}.update=checkout" submodule update --init --depth=1 "$HOST_LIB"
          git submodule update --init --depth=1 lib/android_arm64

      - name: Stage Vulkan headers
        run: |
          VER="1.4.341"
          if [ -f "build_files/build_environment/cmake/versions.cmake" ]; then
            PARSED_VER="$(sed -n 's/.*set(VULKAN_VERSION \([0-9.]*\)).*/\1/p' build_files/build_environment/cmake/versions.cmake | head -n 1)"
            if [ -n "$PARSED_VER" ]; then
              VER="$PARSED_VER"
            fi
          fi
          curl -fL -o /tmp/vh.tar.gz "https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/v${VER}.tar.gz"
          tar -xzf /tmp/vh.tar.gz -C /tmp
          mkdir -p ../blender_build_android/lib/vulkan_headers
          rm -rf ../blender_build_android/lib/vulkan_headers/include
          cp -R "/tmp/Vulkan-Headers-${VER}/include" ../blender_build_android/lib/vulkan_headers/include

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: blender-android-ccache-${{ runner.os }}-${{ hashFiles('build_files/android/**', 'CMakeLists.txt') }}
          restore-keys: |
            blender-android-ccache-${{ runner.os }}-

      - name: Build blender_full.apk
        run: |
          mkdir -p artifacts
          ./build_files/android/build_apk.sh full
          test -f ../blender_build_android/android_apk_stage_full/blender-full.apk
          cp ../blender_build_android/android_apk_stage_full/blender-full.apk artifacts/blender_full.apk
          rm -rf ../blender_build_android/build_android_full \
                 ../blender_build_android/build_host_tools_full \
                 ../blender_build_android/android_apk_stage_full

      - name: Build blender_lite.apk
        run: |
          ./build_files/android/build_apk.sh lite
          test -f ../blender_build_android/android_apk_stage_lite/blender-lite.apk
          cp ../blender_build_android/android_apk_stage_lite/blender-lite.apk artifacts/blender_lite.apk
          rm -rf ../blender_build_android/build_android_lite \
                 ../blender_build_android/build_host_tools_lite \
                 ../blender_build_android/android_apk_stage_lite

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apks-${{ github.sha }}
          path: |
            artifacts/blender_full.apk
            artifacts/blender_lite.apk
          if-no-files-found: error
